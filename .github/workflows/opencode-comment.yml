name: opencode-comment

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: self-hosted
    if: |
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))) ||
      (github.event.label.name == 'bot/review')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      IS_PR: ${{ github.event.pull_request != null || github.event.issue.pull_request != null }}
      PR_PROMPT: ${{ vars.OPENCODE_PR_PROMPT }}
      ISSUE_PROMPT: ${{ vars.OPENCODE_ISSUE_PROMPT }}
    steps:
      - name: Validate prompt
        shell: bash
        run: |
          if [ "$IS_PR" == "true" ]; then
            if [ -z "$PR_PROMPT" ]; then
              echo "::error::vars.OPENCODE_PR_PROMPT is required for PR comments"
              exit 1
            fi
            echo "PROMPT<<PROMPT_EOF" >> "$GITHUB_ENV"
            printf '%s\n' "$PR_PROMPT" >> "$GITHUB_ENV"
            echo "PROMPT_EOF" >> "$GITHUB_ENV"
          else
            if [ -z "$ISSUE_PROMPT" ]; then
              echo "::error::vars.OPENCODE_ISSUE_PROMPT is required for issue comments"
              exit 1
            fi
            echo "PROMPT<<PROMPT_EOF" >> "$GITHUB_ENV"
            printf '%s\n' "$ISSUE_PROMPT" >> "$GITHUB_ENV"
            echo "PROMPT_EOF" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run opencode
        shell: bash
        run: opencode github run
        env:
          MODEL: gw/default
          USE_GITHUB_TOKEN: "true"
          GITHUB_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL_ID: ${{ vars.OPENCODE_MODEL_ID }}
          PROMPT: ${{ env.PROMPT }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "gw": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Custom Gateway",
                  "options": {
                    "baseURL": "${OPENCODE_BASE_URL}",
                    "apiKey": "{env:OPENCODE_API_KEY}"
                  },
                  "models": {
                    "default": { "id": "{env:OPENCODE_MODEL_ID}" }
                  }
                }
              }
            }

      - name: Remove trigger label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const number = context.payload.issue?.number ?? context.payload.pull_request?.number
            if (!number) {
              console.log('no issue/PR number, skipping label removal')
              process.exit(0)
            }
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'bot/review' })
            } catch (e) {
              if (e.status !== 404) throw e
              console.log('bot/review label not present, skipping')
            }
